services:
  - type: web
    name: reversa-app-sdk
    runtime: node
    rootDir: reversa-app-sdk
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PUBLIC_ORIGIN
        value: https://reversa-app-sdk.onrender.com
